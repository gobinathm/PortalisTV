# Builds on detekt's default configuration; only deviations are listed here.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview']
    excludes: ['**/test/**', '**/designsystem/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

formatting:
  FunctionNaming:
    active: false
  MaximumLineLength:
    maxLineLength: 120
