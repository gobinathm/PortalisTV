name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post your portal URL, MAC address, serial number, device IDs, login or tokens.** Requests for portals, playlists or channels are closed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV device and Android version
      placeholder: e.g. Chromecast with Google TV (4K), Android 14
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: Optional. App logs are redacted automatically, but check them before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed all portal URLs, MAC addresses, serials, device IDs and credentials from this report.
          required: true
